name: Build AuraOS ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Arch environment
        run: |
          set -eux
          # Initialize pacman keyring
          pacman-key --init
          pacman-key --populate archlinux

          # Update mirrorlist to use reliable mirrors
          echo 'Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch' > /etc/pacman.d/mirrorlist

          # Fully update system and keyring first
          pacman -Syyu --noconfirm

          # Install build dependencies
          pacman -S --noconfirm archiso dosfstools e2fsprogs

      - name: Check disk space
        run: |
          df -h
          echo "---"
          du -sh /tmp/* 2>/dev/null || true

      - name: Build ISO
        run: |
          set -eux
          mkarchiso -v -w /tmp/auraos-build ./profile
          echo "=== Build complete ==="
          ls -lah /tmp/auraos-build/
          find /tmp/auraos-build -name "*.iso" -type f

      - name: Locate and copy ISO
        run: |
          set -eux
          ISO_PATH=$(find /tmp/auraos-build -name "*.iso" -type f | head -n1)
          if [ -z "$ISO_PATH" ]; then
            echo "ERROR: No ISO found"
            find /tmp/auraos-build -type f | head -50
            exit 1
          fi
          echo "Found: $ISO_PATH"
          cp "$ISO_PATH" /tmp/auraos.iso
          ls -lah /tmp/auraos.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: auraos-iso
          path: /tmp/auraos.iso
          retention-days: 30
