name: Build AuraOS ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Arch environment
        run: |
          set -eux
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syyu --noconfirm
          pacman -S --noconfirm archiso dosfstools e2fsprogs

      - name: Check disk space
        run: df -h

      - name: Build ISO
        run: |
          set -eux
          mkarchiso -v -w /tmp/auraos-build -o /tmp/auraos-out ./profile
          echo "=== Build complete ==="
          ls -lah /tmp/auraos-out/

      - name: Locate and copy ISO
        run: |
          set -eux
          ISO_PATH=$(find /tmp/auraos-out -name "*.iso" -type f | head -n1)
          if [ -z "$ISO_PATH" ]; then
            echo "ERROR: No ISO found in /tmp/auraos-out"
            find /tmp/auraos-build -name "*.iso" -type f 2>/dev/null || true
            find . -name "*.iso" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found: $ISO_PATH"
          cp "$ISO_PATH" /tmp/auraos.iso
          ls -lah /tmp/auraos.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: auraos-iso
          path: /tmp/auraos.iso
          retention-days: 30
